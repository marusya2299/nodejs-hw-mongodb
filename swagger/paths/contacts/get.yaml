
      tags:
        - Contacts
      summary: Get all contacts (paginated, sorted, filtered)
      operationId: getContacts
      description: Returns a list of user's contacts with pagination, sorting, and filtering
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number (starts from 1)
        - in: query
          name: perPage
          schema:
            type: integer
            default: 10
          description: Number of contacts per page
        - in: query
          name: sortBy
          schema:
            type: string
            enum:
              - _id
              - phoneNumber
              - email
              - isFavourite
              - contactType
              - createdAt
              - updatedAt
            default: _id
          description: Field to sort by
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: Sort ascending or descending
        - in: query
          name: name
          schema:
            type: string
          description: Filter by name (partial match)
        - in: query
          name: isFavourite
          schema:
            type: boolean
          description: Filter by favourite status
        - in: query
          name: contactType
          schema:
            type: string
            enum: [personal, work, family]
          description: Filter by contact type
      responses:
        '200':
          description: Successfully found contacts
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                  - data
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully found contacts!
                  data:
                    type: object
                    required:
                      - data
                      - page
                      - perPage
                      - totalItems
                      - totalPages
                      - hasNextPage
                      - hasPreviousPage
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            _id:
                              type: string
                              example: '68761b1196132d92dae30c49'
                            name:
                              type: string
                              example: Ivan
                            phoneNumber:
                              type: string
                              example: '+380000000000'
                            email:
                              type: string
                              example: 'ivan@example.com'
                            isFavourite:
                              type: boolean
                              example: true
                            contactType:
                              type: string
                              example: work
                            userId:
                              type: string
                              example: '687614946cc14693324fcbee'
                            createdAt:
                              type: string
                              format: date-time
                              example: '2025-07-15T09:10:41.466Z'
                            updatedAt:
                              type: string
                              format: date-time
                              example: '2025-07-17T08:34:14.484Z'
                            photo:
                              type: string
                              format: uri
                              example: 'https://res.cloudinary.com/dcosd10rv/image/upload/v1752741251/ek6vzazltqrv0c8fcecw.heic'
                      page:
                        type: integer
                        example: 1
                      perPage:
                        type: integer
                        example: 10
                      totalItems:
                        type: integer
                        example: 7
                      totalPages:
                        type: integer
                        example: 1
                      hasNextPage:
                        type: boolean
                        example: false
                      hasPreviousPage:
                        type: boolean
                        example: false
        '401':
          $ref: '../../components/responses/401.yaml'                
