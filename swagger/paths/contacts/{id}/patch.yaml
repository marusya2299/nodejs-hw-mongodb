tags:
  - Contacts
summary: Update contact by id
operationId: updateContact
description: Update existing contact data, including photo if provided
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: "64e345fa2b1a4b12c3d45678"
requestBody:
  required: true
  description: Optional field. Do not check "Send empty value" if you want to skip updating this field.
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: "Contact's name"
            example: "Jane Doe"
          phoneNumber:
            type: string
            description: "Contact's phone number"
            example: "+987654321"
          email:
            type: string
            format: email
            description: "Contact's email"
            example: "jane@example.com"
          isFavourite:
            type: boolean
            description: "Is contact a favourite"
            example: true
          contactType:
            type: string
            enum: [work, home, personal]
            description: "Contact type"
            example: "work"
          photo:
            type: string
            format: binary
            description: "New photo file (optional)"
responses:
  '200':
    description: Successfully updated a contact!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated a contact!
            data:
              type: object
              required:
                - name
                - phoneNumber
                - email
                - isFavourite
                - contactType
                - userId
                - _id
                - createdAt
                - updatedAt
              properties:
                name:
                  type: string
                  example: John Doe
                phoneNumber:
                  type: string
                  example: +123456789
                email:
                  type: string
                  example: john@example.com
                isFavourite:
                  type: boolean
                  example: false
                contactType:
                  type: string
                  example: personal
                userId:
                  type: string
                  example: 687614946cc14693324fcbee
                _id:
                  type: string
                  example: 687c993ed2763d1e442af404
                createdAt:
                  type: string
                  format: date-time
                  example: 2025-07-20T07:22:38.063Z
                updatedAt:
                  type: string
                  format: date-time
                  example: 2025-07-20T07:22:38.063Z
                photo:
                  type: string
                  format: uri
                  example: https://res.cloudinary.com/uqwgdu/image/upload/image.png

  '400':
    $ref: '../../../components/responses/400.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
