tags:
  - Contacts
summary: Update contact by id
operationId: updateContact
description: Update existing contact data, including photo if provided
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: "64e345fa2b1a4b12c3d45678"
requestBody:
  required: true
  description: Optional field. Do not check "Send empty value" if you want to skip updating this field.
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: "Contact's name"
            example: "Jane Doe"
          phoneNumber:
            type: string
            description: "Contact's phone number"
            example: "+987654321"
          email:
            type: string
            format: email
            description: "Contact's email"
            example: "jane@example.com"
          isFavourite:
            type: boolean
            description: "Is contact a favourite"
            example: true
          contactType:
            type: string
            enum: [work, home, personal]
            description: "Contact type"
            example: "work"
          photo:
            type: string
            format: binary
            description: "New photo file (optional)"
responses:
  '200':
    description: Successfully updated a contact!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated a contact!
            data:
               $ref: "../../../components/schemas/contact.yaml"
  '400':
    $ref: '../../../components/responses/400.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
