tags:
  - Contacts
summary: Get contact by id
operationId: getContact
description: Get contact by id
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
responses:
  '200':
    description: Get contact by id
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully get a contact!
            data:
              type: object
              required:
                - name
                - phoneNumber
                - email
                - isFavourite
                - contactType
                - userId
                - _id
                - createdAt
                - updatedAt
              properties:
                name:
                  type: string
                  example: John Doe
                phoneNumber:
                  type: string
                  example: +123456789
                email:
                  type: string
                  example: john@example.com
                isFavourite:
                  type: boolean
                  example: false
                contactType:
                  type: string
                  example: personal
                userId:
                  type: string
                  example: 687614946cc14693324fcbee
                _id:
                  type: string
                  example: 687c993ed2763d1e442af404
                createdAt:
                  type: string
                  format: date-time
                  example: 2025-07-20T07:22:38.063Z
                updatedAt:
                  type: string
                  format: date-time
                  example: 2025-07-20T07:22:38.063Z
                photo:
                  type: string
                  format: uri
                  example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
