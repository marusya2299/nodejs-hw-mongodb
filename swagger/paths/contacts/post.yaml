tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Add a new contact to the database with optional photo
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - email
          - phoneNumber
          - isFavourite
          - contactType
        properties:
          name:
            type: string
            description: "Contact's name"
            example: "John Doe"
          phoneNumber:
            type: string
            description: "Contact's phone number"
            example: "+123456789"
          email:
            type: string
            format: email
            description: "Contact's email"
            example: "john@example.com"
          isFavourite:
            type: boolean
            description: "Is contact a favourite"
            example: false
          contactType:
            type: string
            enum: [work, home, personal]
            description: "Contact type"
            example: "personal"
          photo:
            type: string
            format: binary
            description: "Photo file"
responses:
  '201':
    description: Successfully created a contact!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              required:
                - name
                - phoneNumber
                - email
                - isFavourite
                - contactType
                - userId
                - _id
                - createdAt
                - updatedAt
              properties:
                name:
                  type: string
                  example: John Doe
                phoneNumber:
                  type: string
                  example: +123456789
                email:
                  type: string
                  example: john@example.com
                isFavourite:
                  type: boolean
                  example: false
                contactType:
                  type: string
                  example: personal
                userId:
                  type: string
                  example: 687614946cc14693324fcbee
                _id:
                  type: string
                  example: 687c993ed2763d1e442af404
                createdAt:
                  type: string
                  format: date-time
                  example: 2025-07-20T07:22:38.063Z
                updatedAt:
                  type: string
                  format: date-time
                  example: 2025-07-20T07:22:38.063Z
                photo:
                  type: string
                  format: uri
                  example: https://res.cloudinary.com/uqwgdu/image/upload/image.png

  '400':
    $ref: '../../components/responses/400.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
